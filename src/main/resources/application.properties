spring.application.name=shipping-bridge
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shipping_bridge}
spring.datasource.username=${DB_USERNAME:shipping}
spring.datasource.password=${DB_PASSWORD:shipping}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.cache.type=simple

logistics.provider=${LOGISTICS_PROVIDER:mock}
logistics.shiprocket.base-url=${SHIPROCKET_BASE_URL:https://apiv2.shiprocket.in/v1/external}
logistics.shiprocket.token=${SHIPROCKET_TOKEN:}
logistics.shiprocket.pickup-postcode=${SHIPROCKET_PICKUP_POSTCODE:110001}

logging.level.com.example.demo=${APP_LOG_LEVEL:INFO}

email.provider=${EMAIL_PROVIDER:smtp}
email.from=${EMAIL_FROM:taraksh9a33@gmail.com}
email.verification-base-url=${EMAIL_VERIFICATION_BASE_URL:http://localhost:8080/api/auth/verify}
email.smtp.host=${SMTP_HOST:smtp.gmail.com}
email.smtp.port=${SMTP_PORT:587}
email.smtp.username=${SMTP_USER:}
email.smtp.password=${SMTP_PASS:}
